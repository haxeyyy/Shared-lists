<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}
form {
  width: 35%;
  margin: 0 auto 24px;
  padding: 6px;
  border: 3px solid #f1f1f1;
}

h2 {
  text-align: center;
}

input[type=text], input[type=password] {
border-radius: 16px;
width: 100%;
padding: 12px 20px;
margin: 8px auto;
display: block;
border: 1px solid #ccc;
box-sizing: border-box;
}

button {
border-radius: 16px;
display: block;
background-color: #04AA6D;
color: white;
padding: 14px 20px;
margin: 20px auto;
border: none;
cursor: pointer;
width: 40%;
}

button:hover {
opacity: 0.8;
}

.cancelbtn {
width: auto;
padding: 10px 18px;
background-color: #f44336;
}

.imgcontainer {
text-align: center;
margin: 24px 0 12px 0;
}

img.avatar {
display: block;
margin: 8px auto;
width: 40%;
border-radius: 50%;
}

.container {
padding: 16px;
}

span.psw {
display: block;
text-align: right;
}

span.register {
  display: block;
  text-align: center;
}

label {
  display: block;
  width: 100%;
  margin: 8px auto 0;
  text-align: left;
}


@media screen and (max-width: 300px) {
span.psw {
display: block;
float: none;
}
}
</style>
</head>
<body>

<div class="imgcontainer">
    <img src="img_avatar2.png" alt="Logo" class="avatar">
</div>

<h2>Login to your shared lists</h2>

<form action="../api/controllers/AuthController.php" method="post">

<div class="container">
<label for="uname"><b>Username</b></label>
<input type="text" placeholder="Enter Username" name="uname" required>

<label for="psw"><b>Password</b></label>
<input type="password" placeholder="Enter Password" name="psw" required>
<span class="psw">Forgot <a href="#">password?</a></span>

<button type="submit">Login</button>
<label>
<input type="checkbox" checked="checked" name="remember"> Remember me
</label>
</div>

</form>

<form>
  <span class="register"> <a href="register.html">No account yet?</a></span>
</form>

</body>
</html>
